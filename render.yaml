# =============================================================================
# TrendForge — Render Blueprint (Option A: workers only)
# =============================================================================
#
# Manages 3 services:
#   - trendforge-worker-api   (FastAPI control plane)
#   - trendforge-celery-worker (Celery worker, free-tier hack)
#   - trendforge-celery-beat   (Celery beat scheduler, free-tier hack)
#
# The web frontend (`trendforge`, Starter plan) is managed manually.
#
# Free tier caveats:
#   1. Worker-api sleeps after 15 min idle. First request = 30-60s cold start.
#   2. Celery worker + beat use a "web service" hack — runs uvicorn placeholder
#      side-by-side with the Celery process so Render thinks they're healthy.
#   3. MUST setup external pinger (cron-job.org):
#        - Ping https://trendforge-celery-worker.onrender.com/health every 10 min
#        - Ping https://trendforge-celery-beat.onrender.com/health every 10 min
#   4. Tasks running > 15 min may get killed mid-execution.
#   5. Free tier total cap = 750 hours/month.
# =============================================================================

services:
  # ---------- FastAPI control plane (HTTP triggers) ----------
  - type: web
    name: trendforge-worker-api
    runtime: docker
    plan: free
    dockerfilePath: ./workers/Dockerfile
    dockerContext: ./workers
    dockerCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5

  # ---------- Celery worker (free-tier hack: web service wrapper) ----------
  # Single-line command para iwasan yung "Unterminated quoted string" error.
  # Ang & operator ay nagpapatakbo ng uvicorn sa background, then exec ng celery.
  - type: web
    name: trendforge-celery-worker
    runtime: docker
    plan: free
    dockerfilePath: ./workers/Dockerfile
    dockerContext: ./workers
    dockerCommand: sh -c 'uvicorn health_only:app --host 0.0.0.0 --port $PORT & exec celery -A celery_app worker --loglevel=info --concurrency=1 --without-gossip --without-mingle'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5

  # ---------- Celery beat (scheduler) ----------
  - type: web
    name: trendforge-celery-beat
    runtime: docker
    plan: free
    dockerfilePath: ./workers/Dockerfile
    dockerContext: ./workers
    dockerCommand: sh -c 'uvicorn health_only:app --host 0.0.0.0 --port $PORT & exec celery -A celery_app beat --loglevel=info'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false